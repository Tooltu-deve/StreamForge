[project]
name = "sf-base"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic-settings>=2.4",
  "boto3>=1.35",
  "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "moto>=5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sf_base*"]
