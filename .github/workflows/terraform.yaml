name: Terraform CI

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yaml"]
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  id-token: write        
  contents: read 
  pull-requests: write   

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: "1.15.0"   

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [infra/foundation, infra/env/dev]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
      - name: TFLint
        run: tflint --init && tflint

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ matrix.dir }}
          config_file: .checkov.yaml
          quiet: true
          soft_fail: false

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const out = `#### Terraform Plan \`${{ matrix.dir }}\` — ${{ steps.plan.outcome }}
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: out
            });
            
  platform-lint:
    # Platform + edge layers depend on live cluster/ALB resources that don't exist
    # at rest, so they only get fmt + validate (no backend init, no plan).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [infra/platform/dev, infra/edge/dev]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.dir }}
      - name: Terraform validate (no backend)
        run: terraform init -backend=false && terraform validate -no-color
        working-directory: ${{ matrix.dir }}
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ matrix.dir }}
          config_file: .checkov.yaml
          quiet: true
          soft_fail: false

