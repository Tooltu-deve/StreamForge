apiVersion: networking.k8s.io/v1
kind: Ingress 
metadata: 
  name: streamforge 
  namespace: {{ .Values.namespace }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.albCertArn }}
    alb.ingress.kubernetes.io/security-group-prefix-lists: {{ .Values.cloudfrontPrefixListId }}
    alb.ingress.kubernetes.io/actions.deny: >
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"403","messageBody":"Forbidden"}}
    alb.ingress.kubernetes.io/conditions.catalog: >
      [{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"X-Origin-Secret","values":["{{ .Values.originSecret }}"]}}]
    alb.ingress.kubernetes.io/conditions.upload: >
      [{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"X-Origin-Secret","values":["{{ .Values.originSecret }}"]}}]
    alb.ingress.kubernetes.io/conditions.playback: >
      [{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"X-Origin-Secret","values":["{{ .Values.originSecret }}"]}}]
spec: 
  ingressClassName: alb
  rules: 
    - http: 
        paths: 
          - path: /api/catalog
            pathType: Prefix
            backend: { service: { name: catalog, port: {number: 80 } } }
          - path: /api/upload 
            pathType: Prefix 
            backend: { service: { name: upload, port: { number: 80 } } }
          - path: /api/playback
            pathType: Prefix
            backend: { service: { name: playback, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: deny, port: { name: use-annotation } } }  