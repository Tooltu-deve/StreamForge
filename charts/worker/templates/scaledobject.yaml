{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    name: {{ .Values.name }}
  minReplicaCount: 0
  maxReplicaCount: {{ .Values.keda.maxReplicas }}
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: {{ .Values.keda.queueUrl | quote }}
        queueLength: "1"
        awsRegion: {{ .Values.env.REGION | quote }}
        identityOwner: operator
{{- end }}
